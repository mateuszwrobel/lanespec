name: Build lanespec binaries (reusable matrix)

# Reusable build matrix (the exact shape the release machinery runs): the
# publish-gate plus the two Linux builds. Called on every release tag by
# release.yml, and callable on any ref by maintainers (workflow_dispatch) to
# rehearse a matrix without publishing anything — this workflow has NO release
# job, NO npm job and writes nothing outside its own run artifacts.

on:
  workflow_call:
    inputs:
      ref_name:
        description: Tag-shaped version ref to build and name assets with (e.g. lanespec-v1.2.3)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref_name:
        description: Tag-shaped version ref to build and name assets with (e.g. lanespec-v1.2.3)
        type: string
        required: true

# Least privilege: builds read the tree and upload run artifacts only.
permissions:
  contents: read

env:
  # The tag-shaped ref every job derives the version from. release.yml
  # passes github.ref_name; a dispatch passes the ref explicitly. The
  # publish-gate's tag-shape gate runs before any build consumes it.
  LANESPEC_TAG: ${{ inputs.ref_name }}

jobs:
  publish-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tag shape gate
        run: sh npm/scripts/gate-tag.sh "${LANESPEC_TAG}"
      - name: Registry existence gate
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          set -euo pipefail
          ver="${LANESPEC_TAG#lanespec-v}"
          if [ -z "${NPM_SCOPE:-}" ]; then
            echo "publish-gate: vars.NPM_SCOPE is unset — the npm channel is not configured, no npm pin exists to break; publish-npm still fails closed below"
            exit 0
          fi
          sh npm/scripts/gate-registry.sh --pkg "@${NPM_SCOPE}/lanespec" --version "${ver}"

  build-linux-x86_64:
    needs: publish-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # The crate's own floor: Cargo.toml declares rust-version 1.99 and
          # the payload ships no rust-toolchain.toml, so the matrix pins it.
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools dpkg-dev
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package tarball
        run: |
          set -euo pipefail
          ver="${LANESPEC_TAG#lanespec-v}"
          bin="target/x86_64-unknown-linux-musl/release/lanespec"
          pkg="lanespec-${ver}-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$pkg" lanespec
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Package deb
        run: |
          set -euo pipefail
          ver="${LANESPEC_TAG#lanespec-v}"
          stage="deb-lanespec"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: lanespec
          Version: ${ver}
          Architecture: amd64
          Maintainer: lanespec developers <publisher@lanespec.invalid>
          Description: Lane lifecycle CLI
           Launch, supervise, audit and recover detached process lanes.
          EOF
          install -m 755 target/x86_64-unknown-linux-musl/release/lanespec "$stage/usr/bin/lanespec"
          dpkg-deb --build "$stage" "lanespec_${ver}_amd64.deb"
          sha256sum "lanespec_${ver}_amd64.deb" > "lanespec_${ver}_amd64.deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: linux-x86_64
          path: |
            lanespec-*.tar.gz
            lanespec-*.tar.gz.sha256
            lanespec_*.deb
            lanespec_*.deb.sha256

  build-linux-aarch64:
    needs: publish-gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Package tarball
        run: |
          set -euo pipefail
          ver="${LANESPEC_TAG#lanespec-v}"
          bin="target/aarch64-unknown-linux-gnu/release/lanespec"
          pkg="lanespec-${ver}-aarch64-unknown-linux-gnu.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$pkg" lanespec
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Package deb
        run: |
          set -euo pipefail
          ver="${LANESPEC_TAG#lanespec-v}"
          stage="deb-lanespec"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: lanespec
          Version: ${ver}
          Architecture: arm64
          Maintainer: lanespec developers <publisher@lanespec.invalid>
          Description: Lane lifecycle CLI
           Launch, supervise, audit and recover detached process lanes.
          EOF
          install -m 755 target/aarch64-unknown-linux-gnu/release/lanespec "$stage/usr/bin/lanespec"
          dpkg-deb --build "$stage" "lanespec_${ver}_arm64.deb"
          sha256sum "lanespec_${ver}_arm64.deb" > "lanespec_${ver}_arm64.deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: linux-aarch64
          path: |
            lanespec-*.tar.gz
            lanespec-*.tar.gz.sha256
            lanespec_*.deb
            lanespec_*.deb.sha256
