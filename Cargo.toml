[workspace]
resolver = "2"

[package]
name = "lanespec"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Lane lifecycle CLI: launch, supervise, audit and recover detached process lanes."

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = ["gitea"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unused_imports = "deny"

[lints.clippy]
all = "deny"
